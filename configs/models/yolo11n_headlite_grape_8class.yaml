# YOLO11n Head-Lite for the curated 8-class grape disease dataset.
# Backbone and native YOLO11 PAN-FPN are kept identical to the baseline.
# Only the three Detect inputs are lightly enhanced to preserve pretrained transfer.
nc: 8
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]     # 16: P3
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]     # 19: P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]     # 22: P5

  - [16, 1, EFSAEnhance, [0.18, 0.16, 0.04, 0.02, 0.08]]
  - [19, 1, CoordECA, [0.10, 0.08, 32, 3, 0.02, 0.08]]
  - [22, 1, CoordECA, [0.08, 0.06, 32, 3, 0.02, 0.08]]
  - [[23, 24, 25], 1, Detect, [nc]]
