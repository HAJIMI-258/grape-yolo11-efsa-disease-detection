# Same architecture as yolo11n_efsa_grape.yaml, but filename selects the YOLO11 "s" scale.
nc: 11
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, EFSAEnhance, [0.12, 0.10, 0.08]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, EFSAEnhance, [0.10, 0.08, 0.08]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]
  - [-1, 1, EFSAEnhance, [0.08, 0.06, 0.06]]

head:
  - [-1, 1, CARAFEUp, [2, 3, 32]]
  - [[-1, 8], 1, BiFPNFuse, [512]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, CoordECA, [0.10, 0.08]]
  - [-1, 1, CARAFEUp, [2, 3, 32]]
  - [[-1, 5], 1, BiFPNFuse, [256]]
  - [-1, 2, C3k2, [256, False]]
  - [-1, 1, CoordECA, [0.10, 0.08]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, BiFPNFuse, [512]]
  - [-1, 2, C3k2, [512, False]]
  - [-1, 1, CoordECA, [0.08, 0.08]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, BiFPNFuse, [1024]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, CoordECA, [0.06, 0.06]]
  - [[21, 25, 29], 1, Detect, [nc]]
