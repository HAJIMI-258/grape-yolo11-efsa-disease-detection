# HighSource7 1.4M capacity-reallocation control.
# The shallow/P4 backbone channels match YOLO11n so COCO weights can transfer
# through layer 6. The neck is explicitly budgeted around lesion-sensitive P3/P4.
nc: 7
scales:
  n: [0.33, 1.00, 640]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 2, C3k2, [64, False, 0.25]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, SPPF, [128, 5]]
  - [-1, 2, C2PSA, [128]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [112, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [72, False]] # P3

  - [-1, 1, Conv, [72, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [112, False]] # P4

  - [-1, 1, Conv, [112, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [112, True]] # P5

  - [[16, 19, 22], 1, Detect, [nc]]
