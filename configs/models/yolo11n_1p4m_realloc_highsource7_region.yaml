# HighSource7 1.4M capacity-reallocation control.
# Uses explicit channels so capacity is restored mainly to P3/P4 while P5 remains compact.
# This is the parameter-matched control for the selective-GEW variant.
nc: 7
scales:
  n: [0.33, 1.00, 640]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 2, C3k2, [64, False, 0.25]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 2, C3k2, [120, False, 0.25]]
  - [-1, 1, Conv, [120, 3, 2]]
  - [-1, 2, C3k2, [120, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, SPPF, [128, 5]]
  - [-1, 2, C2PSA, [128]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [120, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [64, False]] # P3

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [120, False]] # P4

  - [-1, 1, Conv, [120, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]] # P5

  - [[16, 19, 22], 1, Detect, [nc]]
