# YOLO11n-Slim-CoordECA for the high-source seven-class grape disease region dataset.
# Keeps the slim YOLO11n backbone/neck and only adds bounded coordinate-channel
# attention to the three Detect inputs.
nc: 7
scales:
  n: [0.33, 0.25, 768]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [16, 1, CoordECA, [0.08, 0.06, 32, 3, 0.012, 0.06]]
  - [19, 1, CoordECA, [0.07, 0.05, 32, 3, 0.012, 0.06]]
  - [22, 1, CoordECA, [0.06, 0.04, 32, 3, 0.012, 0.06]]
  - [[23, 24, 25], 1, Detect, [nc]]
