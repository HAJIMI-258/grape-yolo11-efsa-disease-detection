# YOLO11n-P3Focus for six-class fine-grained grape disease detection.
# The native YOLO11n backbone, PAN-FPN path, Detect head, and training loss path are kept.
# Only P3/P4 lesion-sensitive features receive bounded EFSA enhancement.
nc: 6
scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, EFSAEnhance, [0.10, 0.12, 0.04, 0.015, 0.07]] # 5-P3 enhanced
  - [-1, 1, Conv, [512, 3, 2]] # 6-P4/16
  - [-1, 2, C3k2, [512, True]] # 7-P4/16
  - [-1, 1, EFSAEnhance, [0.08, 0.10, 0.04, 0.015, 0.06]] # 8-P4 enhanced
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]] # 12

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 8], 1, Concat, [1]] # cat enhanced backbone P4
  - [-1, 2, C3k2, [512, False]] # 15

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat enhanced backbone P3
  - [-1, 2, C3k2, [256, False]] # 18-P3/8 small
  - [-1, 1, EFSAEnhance, [0.12, 0.14, 0.04, 0.015, 0.07]] # 19-P3 refined

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]] # 22-P4/16 medium
  - [-1, 1, CoordECA, [0.08, 0.06, 32, 3, 0.015, 0.06]] # 23-P4 refined

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]] # 26-P5/32 large

  - [[19, 23, 26], 1, Detect, [nc]]
