# YOLO11n-Width20-GEW for high-source seven-class grape disease region detection.
# Migrates the GEW-YOLO ship-detection idea into the current 1.2M grape line:
# GSConvns + VoVGSCSPns slim neck, ESSE before Detect, and WIoU enabled by script.
nc: 7
scales:
  n: [0.33, 0.20, 640]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]
  - [-1, 2, C2PSA, [1024]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, VoVGSCSPns, [512, False, 0.375]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, VoVGSCSPns, [256, False, 0.375]]

  - [-1, 1, GSConvns, [256, 3, 2, 0.5]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, VoVGSCSPns, [512, False, 0.375]]

  - [-1, 1, GSConvns, [512, 3, 2, 0.5]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, VoVGSCSPns, [1024, False, 0.375]]

  - [16, 1, ESSE, [3, 0.015, 0.08]]
  - [19, 1, ESSE, [3, 0.015, 0.08]]
  - [22, 1, ESSE, [3, 0.015, 0.08]]
  - [[23, 24, 25], 1, Detect, [nc]]
