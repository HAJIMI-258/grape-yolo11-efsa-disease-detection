# HighSource7 1.4M selective-GEW model.
# The backbone preserves YOLO11n-compatible channels through layer 6 for useful
# COCO transfer. Paper modules are isolated to the neck instead of replacing it:
# - retain every C3k2 fusion block;
# - use one GSConvns only on the deepest bottom-up downsample;
# - spend the saved parameters on a wider P3 head, full P5 head, and P3/P4 ESSE.
nc: 7
scales:
  n: [0.33, 1.00, 640]

backbone:
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 2, C3k2, [64, False, 0.25]]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 2, C3k2, [128, False, 0.25]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, SPPF, [128, 5]]
  - [-1, 2, C2PSA, [128]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [112, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [72, False]] # P3

  - [-1, 1, Conv, [72, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [112, False]] # P4

  # GSConvns is used once, where semantic detail is least sensitive.
  - [-1, 1, GSConvns, [112, 3, 2, 0.50]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]] # P5

  # The rejected GEW run initialized these gates at 0.015 with max 0.08.
  # V18 uses a still-bounded but non-negligible residual on P3/P4 only.
  - [16, 1, ESSE, [3, 0.04, 0.20]]
  - [19, 1, ESSE, [3, 0.04, 0.20]]
  - [[23, 24, 22], 1, Detect, [nc]]
